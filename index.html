<script>
/* ============ ตั้งค่า: วาง URL Web App ของ Google Apps Script ที่นี่ (หรือกรอกในหน้าครู) ============ */
const API_URL='';
/*CORE*/
/* ---------- ตัดคำนำหน้าชื่อ ---------- */
const TITLES=['เด็กชาย','เด็กหญิง','นางสาว','นาย','นาง','ด.ช.','ด.ญ.','ดช','ดญ'];
function splitName(raw){let s=String(raw||'').trim(),p='';for(const t of TITLES){if(s.startsWith(t)){p=t;s=s.slice(t.length).replace(/^[\s.]+/,'').trim();break}}return{prefix:p,name:s}}
/* ---------- Python Dictionary Simulator (ไม่ใช้ eval / new Function) ---------- */
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const isD=v=>v!==null&&typeof v==='object';
const clone=v=>JSON.parse(JSON.stringify(v));
function sortK(v){if(!isD(v))return v;const o={};Object.keys(v).sort().forEach(k=>o[k]=sortK(v[k]));return o}
const eq=(a,b)=>JSON.stringify(sortK(a))===JSON.stringify(sortK(b));
function repr(v){if(typeof v==='string')return"'"+v+"'";if(isD(v))return'{'+Object.keys(v).map(k=>"'"+k+"': "+repr(v[k])).join(', ')+'}';return String(v)}
function tokenize(src){const T=[],re=/\s*(?:("[^"\n]*")|(-?\d+(?:\.\d+)?)|([A-Za-z_]\w*)|([\[\]{}().,:=+]))/y;let p=0;
 while(!/^\s*$/.test(src.slice(p))){re.lastIndex=p;const m=re.exec(src);if(!m)throw new Error('SyntaxError: พบสัญลักษณ์ที่ไม่รู้จัก');p=re.lastIndex;
  if(m[1]!==undefined)T.push({t:'s',v:m[1].slice(1,-1)});else if(m[2]!==undefined)T.push({t:'n',v:parseFloat(m[2])});else if(m[3]!==undefined)T.push({t:'i',v:m[3]});else T.push({t:'p',v:m[4]})}
 return T}
function runLine(src,env){const T=tokenize(src);let i=0;const E=m=>{throw new Error(m)};
 const P=v=>T[i]&&T[i].t==='p'&&T[i].v===v;
 const need=v=>{if(!P(v))E('SyntaxError: ต้องมี "'+v+'"');i++};
 const str=()=>{const k=T[i++];if(!k||k.t!=='s')E('SyntaxError: Key ต้องเป็นข้อความใน "..."');return k.v};
 const path=()=>{const n=T[i++];if(!n||n.t!=='i')E('SyntaxError: ต้องขึ้นต้นด้วยชื่อตัวแปร');if(n.v!=='lab_data')E("NameError: ไม่รู้จัก '"+n.v+"'");const ks=[];while(P('[')){i++;ks.push(str());need(']')}return ks};
 const walk=ks=>{let c=env.lab_data;for(const k of ks){if(!isD(c))E('TypeError: ค่านี้ไม่ใช่ Dictionary จึงใช้ ["'+k+'"] ไม่ได้');if(!own(c,k))E("KeyError: ไม่พบ Key '"+k+"'");c=c[k]}return c};
 const dict=()=>{need('{');const o={};while(!P('}')){const k=str();need(':');o[k]=val();if(P(','))i++;else break}need('}');return o};
 const atom=()=>{const t=T[i];if(!t)E('SyntaxError: คำสั่งยังไม่สมบูรณ์');if(t.t==='s'||t.t==='n'){i++;return t.v}if(P('{'))return dict();return walk(path())};
 const val=()=>{let a=atom();while(P('+')){i++;const b=atom();if(typeof a==='number'&&typeof b==='number')a=Math.round((a+b)*1e9)/1e9;else if(typeof a==='string'&&typeof b==='string')a+=b;else E('TypeError: บวกข้อมูลคนละชนิดกันไม่ได้')}return a};
 const parent=ks=>{const par=walk(ks);if(!isD(par))E('TypeError: ค่านี้ไม่ใช่ Dictionary');return par};
 let out;const t0=T[0];if(!t0)E('SyntaxError: ยังไม่มีคำสั่ง');
 if(t0.t==='i'&&t0.v==='del'){i++;const ks=path();if(!ks.length)E('SyntaxError: del ต้องระบุ Key');const last=ks.pop(),par=parent(ks);if(!own(par,last))E("KeyError: ไม่พบ Key '"+last+"'");delete par[last]}
 else if(t0.t==='i'&&t0.v==='lab_data'){const save=i,ks=path();
  if(P('=')){i++;if(!ks.length)E('SyntaxError: ต้องระบุ Key ที่จะกำหนดค่า');const v=val(),last=ks.pop();parent(ks)[last]=v}
  else if(P('.')){i++;const m=T[i++];if(!m||m.v!=='pop')E('AttributeError: รองรับเฉพาะ .pop()');need('(');const k=str();need(')');const par=parent(ks);if(!own(par,k))E("KeyError: ไม่พบ Key '"+k+"'");out=par[k];delete par[k]}
  else{i=save;out=val()}}
 else if(t0.t==='s'||t0.t==='n'||P('{'))out=val();else E('SyntaxError: คำสั่งไม่ถูกต้อง');
 if(i<T.length)E('SyntaxError: มีส่วนเกินท้ายคำสั่ง');return out}
function runProgram(code,d){const env={lab_data:clone(d)};let out;const lines=String(code).split('\n').map(s=>s.trim()).filter(Boolean);
 if(!lines.length)return{ok:false,error:'ยังไม่ได้วางคำสั่ง',env,out};
 for(const ln of lines){try{const o=runLine(ln,env);if(o!==undefined)out=o}catch(e){return{ok:false,error:e.message,env,out}}}
 return{ok:true,env,out}}
/* ---------- ด่านทั้ง 9 (ตรวจจากสถานะ Dictionary + ผลลัพธ์ ไม่ใช่ข้อความบนจอ) ---------- */
const BASE={Gravity:9.8,Oxygen_Level:21,Temperature:-15};
const W=(o)=>Object.assign(clone(BASE),o);
const LV=[
{n:'Unlock the Airlock',s:'ประตูห้องทดลองถูกล็อก! อ่านค่า Gravity จาก lab_data เพื่อปลดล็อก',d:BASE,tok:['lab_data','["Gravity"]','["Oxygen_Level"]','["Temperature"]','=','del'],ok:r=>r.out===9.8,h:'เขียนชื่อ Dictionary แล้วตามด้วย Key ในวงเล็บเหลี่ยม [ ]'},
{n:'Oxygen Recovery',s:'ตรวจระดับออกซิเจน: อ่านค่า Oxygen_Level',d:BASE,tok:['lab_data','["Gravity"]','["Oxygen_Level"]','["Temperature"]','=','+'],ok:r=>r.out===21,h:'Key เขียนในเครื่องหมายคำพูดและวงเล็บเหลี่ยมเสมอ'},
{n:'Emergency Code',s:'รหัสปลดล็อก = Oxygen_Level + Gravity อ่านค่าทั้งสองแล้วบวกกัน',d:BASE,tok:['lab_data','["Gravity"]','["Oxygen_Level"]','["Temperature"]','+','='],ok:r=>r.out===30.8,h:'อ่านค่าหนึ่งตัว ใส่ + แล้วอ่านอีกตัว (ต้องใช้ lab_data สองครั้ง)'},
{n:'Chemical Supply',s:'เพิ่มสารเคมี H2O ลง lab_data โดยมี State เป็น "Solid"',d:BASE,tok:['lab_data','["H2O"]','["State"]','=','{"State": "Solid"}','"Solid"','"Liquid"','del'],ok:r=>r.ok&&eq(r.env.lab_data,W({H2O:{State:'Solid'}})),h:'Key ใหม่ใช้รูปแบบ ตัวแปร["Key"] = ค่า และค่าเป็น Dictionary ซ้อนได้'},
{n:'Melting Protocol',s:'H2O กำลังละลาย: แก้ State จาก "Solid" เป็น "Liquid"',d:W({H2O:{State:'Solid'}}),tok:['lab_data','["H2O"]','["State"]','=','"Liquid"','"Solid"','["Gravity"]'],ok:r=>r.ok&&eq(r.env.lab_data,W({H2O:{State:'Liquid'}})),h:'เข้าถึงทีละชั้น: ["H2O"] แล้วตามด้วย ["State"] ก่อนใช้ ='},
{n:'Cooling System',s:'ระบบทำความเย็นต้องตั้ง Temperature เป็น -20',d:BASE,tok:['lab_data','["Temperature"]','["Gravity"]','=','-20','20','-15'],ok:r=>r.ok&&eq(r.env.lab_data,W({Temperature:-20})),h:'Key ที่มีอยู่แล้ว เมื่อใช้ = จะถูกแก้เป็นค่าใหม่'},
{n:'Toxic Leak',s:'แก๊สพิษรั่ว! ลบ Key Toxic_Gas ออกจาก lab_data',d:W({Toxic_Gas:5}),tok:['del','lab_data','["Toxic_Gas"]','["Gravity"]','='],ok:r=>r.ok&&eq(r.env.lab_data,BASE),h:'del ตามด้วยตัวแปรและ Key ที่ต้องการลบ'},
{n:'Emergency Purge',s:'ลบ Leak_Pressure ออก และต้องได้ค่าที่ลบกลับมาแสดงด้วย (ต้องได้ 80)',d:W({Toxic_Gas:5,Leak_Pressure:80}),tok:['del','lab_data','["Leak_Pressure"]','.pop("Leak_Pressure")','.pop("Toxic_Gas")','["Toxic_Gas"]'],ok:r=>r.ok&&r.out===80&&eq(r.env.lab_data,W({Toxic_Gas:5})),h:'del ลบเฉย ๆ ไม่ส่งค่ากลับ ส่วน .pop() ลบและส่งค่าที่ลบกลับมา'},
{n:'Final System Recovery',s:'กอบกู้สถานี: ลบ Toxic_Gas และเปลี่ยน H2O State เป็น "Liquid" (2 บรรทัด ใช้ปุ่มขึ้นบรรทัดใหม่)',d:W({Toxic_Gas:5,H2O:{State:'Solid'}}),tok:['del','lab_data','["Toxic_Gas"]','["H2O"]','["State"]','=','"Liquid"','NL'],ok:r=>r.ok&&eq(r.env.lab_data,W({H2O:{State:'Liquid'}})),h:'ทำทีละบรรทัด: บรรทัดแรกลบ Toxic_Gas, ขึ้นบรรทัดใหม่, บรรทัดสองแก้ State'}
];
const MAINS=['ACCESS DATA','MODIFY DATA','DELETE DATA'];
const lvScore=(wrong,hint)=>Math.max(20,Math.min(100,100-10*wrong-(hint?20:0)));
/*ENDCORE*/
/*TESTS*/
function runTests(){const R=[],t=(n,f)=>{try{R.push([n,!!f()])}catch(e){R.push([n+' (exception)',false])}},run=(c,d=BASE)=>runProgram(c,d);
const SOL=['lab_data["Gravity"]','lab_data["Oxygen_Level"]','lab_data["Oxygen_Level"] + lab_data["Gravity"]','lab_data["H2O"] = {"State": "Solid"}','lab_data["H2O"]["State"] = "Liquid"','lab_data["Temperature"] = -20','del lab_data["Toxic_Gas"]','lab_data.pop("Leak_Pressure")','del lab_data["Toxic_Gas"]\nlab_data["H2O"]["State"] = "Liquid"'];
t('read',()=>run('lab_data["Gravity"]').out===9.8);t('add',()=>run('lab_data["Oxygen_Level"] + lab_data["Gravity"]').out===30.8);
t('set',()=>eq(run('lab_data["H2O"] = {"State": "Solid"}').env.lab_data.H2O,{State:'Solid'}));
t('nested',()=>run('lab_data["H2O"]["State"] = "Liquid"',LV[4].d).env.lab_data.H2O.State==='Liquid');
t('del',()=>!own(run('del lab_data["Gravity"]').env.lab_data,'Gravity'));
t('pop',()=>{const r=run('lab_data.pop("Gravity")');return r.out===9.8&&!own(r.env.lab_data,'Gravity')});
t('KeyError',()=>/KeyError/.test(run('lab_data["X"]').error));t('TypeError',()=>/TypeError/.test(run('lab_data["Gravity"]["a"]').error));
t('syntax',()=>!run('lab_data[Gravity]').ok);t('no JS',()=>!run('alert(1)').ok&&!run('lab_data["a"];alert(1)').ok&&!run('constructor.constructor("1")()').ok);
t('input not mutated',()=>{run('del lab_data["Gravity"]');return BASE.Gravity===9.8});
t('names',()=>['เด็กชาย สมชาย ใจดี','ด.ช. สมชาย ใจดี','นายสมชาย ใจดี'].every(x=>splitName(x).name==='สมชาย ใจดี')&&splitName('นางสาว มาลี ใจดี').name==='มาลี ใจดี'&&splitName('สมนาย ใจดี').name==='สมนาย ใจดี');
LV.forEach((l,i)=>{t('L'+(i+1)+' correct passes',()=>{const r=runProgram(SOL[i],l.d);return r.ok&&l.ok(r)});t('L'+(i+1)+' empty fails',()=>{const r=runProgram('',l.d);return !(r.ok&&l.ok(r))})});
t('L8 del alone fails',()=>{const r=runProgram('del lab_data["Leak_Pressure"]',LV[7].d);return !LV[7].ok(r)});
return R}
/*ENDTESTS*/
/* ================= UI ================= */
const $=s=>document.querySelector(s),root=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const apiUrl=()=>(localStorage.getItem('scilab_api')||API_URL||'').trim();
let tk=sessionStorage.getItem('tk')||'',S=null,tick=null,poll=null;const TAB=Math.random().toString(36).slice(2);
async function api(action,data={}){const u=apiUrl();if(!u)return{ok:false,error:'NOAPI'};const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
 try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,tk,...data}),signal:c.signal});return await r.json()}catch(e){return{ok:false,error:'NET'}}finally{clearTimeout(t)}}
const errTxt=r=>r.error==='NOAPI'?'ยังไม่ได้เชื่อมต่อระบบหลังบ้าน (Google Apps Script)':r.error==='NET'?'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่':(r.error||'เกิดข้อผิดพลาด');
/* ---------- เสียง (Web Audio สร้างหลังผู้ใช้กดครั้งแรก) ---------- */
let AC=null,mute=false;$('#snd').onclick=()=>{mute=!mute;$('#snd').innerHTML=mute?'&#128263;':'&#128266;'};
function sfx(k){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq={ok:[660,880],bad:[200,150],click:[500],pass:[523,659,784],over:[300,200,120],end:[523,659,784,1046],warn:[400,300]}[k]||[500];
 seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type=k==='bad'||k==='over'?'sawtooth':'sine';g.gain.value=.07;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.12;o.start(t);o.stop(t+.11)})}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('.btn'))sfx('click')});

function home(){clearInterval(tick);clearInterval(poll);document.body.classList.remove('alert');
 const has=!!apiUrl();
 root.innerHTML=`<div class="card"><h1>SCI-LAB: SPACE LAB EMERGENCY</h1><p class="tag">SYSTEM FAILURE DETECTED — SAVE THE SPACE LAB!</p>
 <p>คุณคือนักวิทยาศาสตร์ฝึกหัดประจำสถานี SCI-LAB ใช้ความรู้เรื่อง Python Dictionary แก้ระบบและกอบกู้สถานีให้สำเร็จ</p>

 <label for="nm">ชื่อ-นามสกุล (ไม่ต้องใส่คำนำหน้า)</label><input id="nm" autocomplete="off" placeholder="เช่น สมชาย ใจดี">

 o.querySelectorAll('[data-hs]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await api('hint',{session:curRoom,sid:b.dataset.hs,text:o.querySelector('[data-h="'+b.dataset.hs+'"]').value.trim()});b.disabled=false;alert(r.ok?'ส่งแล้ว':errTxt(r))})}
/* ================= เริ่มต้น ================= */
if(location.search.includes('test')){const R=runTests(),bad=R.filter(x=>!x[1]);root.innerHTML='<div class="card"><h2>Unit tests: '+(R.length-bad.length)+'/'+R.length+' ผ่าน</h2><pre>'+R.map(x=>(x[1]?'PASS ':'FAIL ')+esc(x[0])).join('\n')+'</pre></div>'}
else{const old=JSON.parse(localStorage.getItem('scilab_state')||'null');
 if(old&&!old.done&&old.p){S=old;if(S.mode==='online'){api('progress',{pid:S.pid,level:S.lvl+1,hearts:S.hearts,scores:S.scores,wrong:S.wrongTotal,hints:S.hints,done:false}).then(r=>{if(r.ok){S.saved=true;poll=setInterval(()=>S&&!S.done&&sync(false),10000);play()}else{S=null;localStorage.removeItem('scilab_state');home()}})}else play()}
 else home()}
